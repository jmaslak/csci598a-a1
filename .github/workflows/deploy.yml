# Check, then deploy to Render.
#
# Render hosts server.py; this workflow is the gate in front of it. Every push
# to main builds the page, compiles the server and runs the headless recorder
# test, and only when all of that passes does it POST to the service's deploy
# hook. Two repository secrets drive the deploy job:
#
#   RENDER_DEPLOY_HOOK_URL  required - Render dashboard -> service -> Settings
#                           -> Deploy Hook. Without it the checks still run
#                           and the deploy is skipped, so the workflow is
#                           plain CI on any clone that has no Render service.
#   RENDER_API_KEY          optional - Render dashboard -> Account settings ->
#                           API Keys. With it the job waits for the deploy to
#                           go live and fails if Render's build or start
#                           fails; without it the job ends once the deploy is
#                           triggered.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; a queued one is never cancelled.
concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Build serve/index.html
        run: python build.py

      - name: Compile server.py
        run: python -m py_compile server.py

      - name: Headless recorder test
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' composer.html | sed '1d;$d' > /tmp/composer-check.js
          node test_recorder.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy
        id: trigger
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set: checks passed, nothing deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The hook answers {"deploy":{"id":"dep-..."}}; the service id sits
          # in the hook URL itself (/deploy/srv-...?key=...).
          deploy_id=$(curl -fsS -X POST "$HOOK" | python3 -c 'import json,sys; print(json.load(sys.stdin)["deploy"]["id"])')
          service_id=$(printf '%s' "$HOOK" | sed -n 's#.*/deploy/\(srv-[^?]*\).*#\1#p')
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "service_id=$service_id" >> "$GITHUB_OUTPUT"
          echo "Triggered Render deploy $deploy_id." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for it to go live
        if: steps.trigger.outputs.deploy_id != ''
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.trigger.outputs.service_id }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "RENDER_API_KEY is not set: not waiting for the deploy to finish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Poll up to 10 minutes. The free plan builds in about two.
          for i in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "$status"
            case "$status" in
              live)
                echo "Deploy $DEPLOY_ID is live." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy $DEPLOY_ID ended with status $status." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Deploy $DEPLOY_ID still not live after 10 minutes." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
